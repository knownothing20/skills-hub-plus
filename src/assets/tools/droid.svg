<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="droid-bg" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1" />
      <stop offset="1" stop-color="#4338CA" />
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="5.5" fill="url(#droid-bg)" />
  <!-- Droid antenna -->
  <line x1="12" y1="4" x2="12" y2="7" stroke="#C7D2FE" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="12" cy="4" r="1.2" fill="#38BDF8" />
  <!-- Droid head chassis -->
  <rect x="5.5" y="7" width="13" height="11" rx="2.8" fill="#FFFFFF" />
  <!-- Visor -->
  <rect x="7.5" y="9.5" width="9" height="3.2" rx="1.6" fill="#1E1B4B" />
  <circle cx="9.8" cy="11.1" r="1" fill="#38BDF8" />
  <circle cx="14.2" cy="11.1" r="1" fill="#38BDF8" />
  <!-- Mouth grille -->
  <line x1="9" y1="15" x2="15" y2="15" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" />
</svg>
