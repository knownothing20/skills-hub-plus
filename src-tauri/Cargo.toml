[package]
name = "skills-hub"
version = "2.0.4"
description = "A security-hardened desktop app for managing Agent Skills"
authors = ["mcncarl and Skills Hub contributors"]
license = "MIT"
repository = "https://github.com/mcncarl/skills-hub"
edition = "2021"
rust-version = "1.85.0"
# 声明了第二个 [[bin]]（skills-hub-cli）之后，包内就有两个可执行目标。
# `tauri build` 会报 "failed to find main binary"，必须显式指定默认目标。
default-run = "skills-hub"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 命令行同步工具。与 GUI 共用 app_lib，但**刻意不加 `windows_subsystem`**——
# GUI 是 windows 子系统所以没有控制台，CLI 必须有控制台才能打印。
[[bin]]
name = "skills-hub-cli"
path = "src/bin/skills-hub-cli/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
quick-xml = "0.38"
log = "0.4"
tauri = { version = "2.9.5", features = ["tray-icon", "image-png", "test", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
anyhow = "1.0"
plist = "1.8"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5.0"
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
git2 = { version = "0.19", features = ["vendored-openssl"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
uuid = { version = "1", features = ["v4"] }
urlencoding = "2.1"
trash = { version = "=5.2.6", default-features = false, features = ["coinit_multithreaded"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
same-file = "1"

[dev-dependencies]
tempfile = "3"
mockito = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

